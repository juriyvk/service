function renderNav(){const pages=[['home','Задачи','home'],['projects','Проекты','projects'],['requests','Заявки','requests'],['team','Команда','team'],['help','Справка','help']];document.getElementById('nav').innerHTML=pages.map(([k,t,i])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${svg(i)}<span>${t}</span></button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}

er]').forEach(el=>el.onclick=()=>{filter=el.dataset.filter;render()})}

function helpList(items){return items.filter(x=>x.join(' ').toLowerCase().includes(helpSearch.toLowerCase())).map((x,i)=>`<div class="card"><div class="tasktitle">${x[0]}</div><div class="details">${x[1]}</div></div>`).join('')||'<div class="empty">Ничего не найдено</div>'}
function modal(title,html,submit){document.getElementById('modaltitle').textContent=title;document.getElementById('modalbody').innerHTML=html;document.getElementById('modalwrap').classList.add('show');const form=document.getElementById('modalform');if(form)form.onsubmit=e=>{e.preventDefault();submit(new FormData(form))}}
function closeModal(){document.getElementById('modalwrap').classList.remove('show')};document.getElementById('closemodal').onclick=closeModal;document.getElementById('modalwrap').onclick=e=>{if(e.target.id==='modalwrap')closeModal()};
function showTaskForm(){modal('Новая задача',`<form id="modalform"><label class="formlabel">Название</label><input name="title" class="field" required maxlength="120" placeholder="Что нужно сделать?"><label class="formlabel">Мероприятие</label><input name="project" class="field" required placeholder="Например, Байконур"><label class="formlabel">Ответственный</label><input name="person" class="field" required placeholder="Имя сотрудника"><label class="formlabel">Срок</label><input name="date" class="field" required type="date"><button class="btn" style="width:100%">Создать задачу</button></form>`,f=>{tasks.unshift({id:Date.now(),title:f.get('title'),project:f.get('project'),person:f.get('person'),date:f.get('date'),status:'В работе'});save();closeModal();render()})}
function showTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;modal(t.title,`<div class="details">${esc(t.project)} · ${esc(t.person)} · ${fmt(t.date)}</div><div class="spacer"></div><form id="modalform"><label class="formlabel">Статус</label><select class="field" name="status">${['В работе','На согласовании','Просрочено','Выполнено'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" style="width:100%">Сохранить статус</button></form>`,f=>{t.status=f.get('status');save();closeModal();render()})}
function showRequestForm(){modal('Новая заявка',`<form id="modalform"><label class="formlabel">Тип заявки</label><select class="field" name="type"><option>Отпуск</option><option>Командировка</option><option>Отгул</option></select><label class="formlabel">Начало</label><input class="field" name="start" type="date" required><label class="formlabel">Окончание</label><input class="field" name="end" type="date" required><label class="formlabel">Комментарий</label><textarea class="field" name="comment" placeholder="Дополнительная информация"></textarea><button class="btn" style="width:100%">Отправить заявку (демо)</button></form>`,f=>{if(f.get('end')<f.get('start')){alert('Дата окончания должна быть не раньше начала');return}requests.unshift(Object.fromEntries(f.entries()));localStorage.setItem('dvfm_demo_requests',JSON.stringify(requests));closeModal();render()})}
// Identity gate: this is NOT a session. Subsequent data operations must independently authenticate.
const authEndpoint='https://mskbgkiksgpdosiarjvo.supabase.co/functions/v1/telegram-auth';
const contentNode=document.getElementById('content');
const navNode=document.getElementById('nav');
function gate(title, detail, allowRetry=false){
  navNode.innerHTML='';
  contentNode.innerHTML=`<h1>${esc(title)}</h1><div class="card"><p>${esc(detail)}</p>${allowRetry?'<button class="btn" id="retry-auth">Повторить проверку</button>':''}</div>`;
  if(allowRetry)document.getElementById('retry-auth').onclick=checkTelegramAuth;
}
async function checkTelegramAuth(){
  gate('Проверка доступа','Проверяем вход через Telegram…');
  const initData=tg?.initData;
  if(!initData){gate('Откройте через Telegram','Для входа используйте кнопку «Открыть платформу» в @dvfm_service_bot. Обычный браузер не передаёт подписанные данные Telegram.');return;}
  try{
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),12000);
    let resp;
    try{resp=await fetch(authEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData}),signal:controller.signal,cache:'no-store'});}
    finally{clearTimeout(timeout)}
    const result=await resp.json().catch(()=>({}));
    if(!resp.ok||!result.ok){
      const userMessage=resp.status===403?'Ваш Telegram-аккаунт пока не зарегистрирован в системе.':resp.status===401?'Данные входа устарели или не прошли проверку. Закройте приложение и откройте заново через бота.':resp.status===500?'Сервер авторизации пока не настроен. Проверьте Secrets и Logs функции.':'Не удалось подтвердить доступ. HTTP '+resp.status;
      gate('Доступ не подтверждён',userMessage,true);return;
    }
    const employee=result.employee;
    role.value=['manager','admin','deputy'].includes(employee.role)?'manager':'employee';
    document.getElementById('roleLabel').textContent=employee.full_name+' · '+(role.value==='manager'?'Руководитель':'Сотрудник');
    render();
  }catch(err){gate('Нет связи с сервером','Не удалось связаться с telegram-auth. Проверьте подключение, развертывание Edge Function и журнал Logs.',true);}
}
checkTelegramAuth();</script></body></html>
