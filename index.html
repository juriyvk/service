/* === AНО «ДВФМ», 2024 brandbook. Mini App interface adaptation v0.3 === */
:root{
 --bg:#faf6f0;--white:#fff;--text:#2B2135;--muted:#777080;--line:#ebe3ee;
 --olive:#00A552;--soft:#ecfaf3;--danger:#E73B2B;--orange:#FBBA00;
 --violet:#2E1D67;--green:#00A552;--yellow:#FBBA00;--pink:#EB5893;
 --beige:#F0D8C2;--shadow:0 10px 28px rgba(46,29,103,.065);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{font-family:'Onest','Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
button,input,textarea,select{font-family:'Onest','Montserrat',system-ui,sans-serif}
.app{max-width:780px;padding-left:16px;padding-right:16px;padding-bottom:calc(100px + env(safe-area-inset-bottom));}
.top{padding:19px 0 17px;position:relative}
.top::after{content:"";height:3px;position:absolute;bottom:0;left:0;right:0;background:linear-gradient(90deg,var(--green) 0 26%,var(--yellow) 26% 49%,var(--pink) 49% 75%,var(--violet) 75% 100%);border-radius:99px;opacity:.9}
.logo{background:var(--violet);height:42px;width:42px;border-radius:13px;color:#fff;position:relative;overflow:hidden;box-shadow:0 5px 16px rgba(46,29,103,.14);font-family:'Onest',sans-serif;font-weight:900;z-index:0}
.logo::before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--yellow);right:-10px;top:-8px;z-index:-1}
.logo::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--pink);left:-12px;bottom:-9px;z-index:-1}
.brand{font-weight:800;font-size:16px;letter-spacing:-.45px;color:var(--violet)}
.sub{color:#80768b;font-size:11px}
.switch{border:1px solid #eadfeb;background:#fff;color:#5a4b74;max-width:49%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;box-shadow:0 2px 9px rgba(46,29,103,.04)}
h1{font-size:24px;letter-spacing:-.7px;color:var(--violet);font-weight:800;margin-top:18px}
h2{font-weight:800;letter-spacing:-.3px;color:var(--violet)}
.hint{font-size:12px;color:var(--muted);margin-bottom:16px}
.welcome{position:relative;isolation:isolate;background:var(--violet);border-radius:23px;min-height:135px;margin:17px 0 20px;padding:21px 20px;overflow:hidden;color:#fff;box-shadow:0 12px 28px rgba(46,29,103,.16)}
.welcome::before{content:"";position:absolute;right:-40px;top:-65px;width:205px;height:205px;border-radius:50%;background:conic-gradient(from 6deg,var(--yellow) 0deg 88deg,transparent 88deg 127deg,var(--pink) 127deg 214deg,transparent 214deg 249deg,var(--green) 249deg 338deg,transparent 338deg);-webkit-mask:radial-gradient(circle,transparent 0 45px,#000 47px);mask:radial-gradient(circle,transparent 0 45px,#000 47px);z-index:-1}
.welcome::after{content:"";position:absolute;right:57px;bottom:-29px;width:66px;height:66px;background:var(--pink);border-radius:50%;opacity:.77;z-index:-1}
.welcome-tag{font-size:10px;letter-spacing:1.15px;text-transform:uppercase;color:#f7d3e8;font-weight:800;margin-bottom:8px}
.welcome-title{font-size:22px;font-weight:900;letter-spacing:-.8px;line-height:1.1;max-width:240px}
.welcome-note{font-size:12px;line-height:1.45;margin-top:8px;max-width:235px;color:#eee8fa}
.stats{gap:9px;margin:13px 0 23px}
.stat{border:0;box-shadow:var(--shadow);border-radius:17px;min-height:89px;padding:15px 5px;background:#fff}
.stat:first-child{background:#fff}
.stat:nth-child(2){background:#e6f6ee}
.stat:nth-child(3){background:#fff1f5}
.num{color:var(--violet);font-weight:900;font-size:29px}
.stat:nth-child(2) .num{color:#007e44}
.stat:nth-child(3) .num{color:#c4375e}
.stat span{font-size:11px;font-weight:650;color:#71677b}
.toolbar{margin-top:19px;margin-bottom:13px}
.btn{background:var(--green);color:white;border-radius:12px;font-weight:800;font-size:12px;box-shadow:0 4px 10px rgba(0,165,82,.12)}
.btn:hover{background:#008a47}
.ghost{color:var(--violet);border:1px solid #e7e0ec;font-weight:650}
.filters{gap:7px;margin-bottom:14px}
.filter{font-size:12px;border-color:#e9e1e8;background:#fff;color:#776a7d;border-radius:11px}
.filter.active{background:var(--violet);border-color:var(--violet);color:#fff}
.card{background:rgba(255,255,255,.98);border:1px solid #efe9ef;border-radius:17px;box-shadow:var(--shadow);padding:16px;margin:10px 0;position:relative;overflow:hidden}
.card[data-task]::before{content:"";position:absolute;width:4px;top:0;bottom:0;left:0;background:#c9b8e5}
.card[data-task]:has(.pill.progress)::before{background:var(--green)}
.card[data-task]:has(.pill.overdue)::before{background:var(--danger)}
.card[data-task]:has(.pill.review)::before{background:var(--yellow)}
.card[data-task]:has(.pill.done)::before{background:var(--violet)}
.tasktitle{font-size:14px;font-weight:800;color:#30213e;letter-spacing:-.15px}
.overline{color:#98849b;font-weight:700;font-size:10px}
.details{color:#81798b;font-size:11px}
.pill{background:#f1eef8;color:var(--violet);font-weight:800;border-radius:8px;padding:6px 8px}
.pill.progress{background:#e1f6ea;color:#007f43}
.pill.review{background:#fff1ce;color:#8a6000}
.pill.overdue{background:#ffe8e6;color:#ce322b}
.pill.done{background:#eee8fa;color:#5a3f94}
.disclaimer{background:#f7f0fb;color:#756985;border:1px solid #f0e6f3;font-size:11px;border-radius:14px;line-height:1.55}
.nav{background:rgba(255,255,255,.98);border-top:0;box-shadow:0 -6px 22px rgba(46,29,103,.07);padding-top:11px}
.nav::before{content:"";position:absolute;top:0;height:3px;left:0;right:0;background:linear-gradient(90deg,var(--yellow),var(--green),var(--pink),var(--violet));}
.nav button{color:#a097ad;font-weight:650}
.nav button.active{color:var(--violet);font-weight:900}
.nav button.active svg{stroke:var(--violet)}
.field{border-color:#e3dce8;background:#fff;outline-color:#8d75ca}
.formlabel{color:var(--violet)}
.modalwrap{background:rgba(30,15,65,.46)}
.modal{border-radius:27px 27px 0 0}
.close{color:var(--violet);background:#f4effa}
@media(min-width:680px){.app{padding-left:32px;padding-right:32px}.welcome{min-height:163px;padding:28px}.welcome-title{font-size:27px;max-width:360px}.welcome-note{max-width:360px}.welcome::before{width:270px;height:270px;right:-30px;top:-80px;-webkit-mask:radial-gradient(circle,transparent 0 65px,#000 67px);mask:radial-gradient(circle,transparent 0 65px,#000 67px)}}
@media(max-width:360px){.welcome::before{right:-85px}.welcome-title{font-size:20px}.switch{max-width:42%;font-size:10px}.sub{font-size:10px}}
@media(prefers-reduced-motion:no-preference){.card,.btn,.filter{transition:box-shadow .18s,transform .18s,background .18s}.card[data-task]:active{transform:scale(.994)}}

</style></head><body><main class="app"><header class="top"><div class="identity"><div class="logo">С</div><div><div class="brand">СЕРВИС | ДВФМ</div><div class="sub">Внутренняя платформа отдела</div></div></div><span class="switch" id="roleLabel">Проверка входа…</span></header><section id="content"></section></main><nav class="nav"><div class="navinner" id="nav"></div></nav><div class="modalwrap" id="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="modalhead"><h2 id="modaltitle"></h2><button class="close" id="closemodal" aria-label="Закрыть">×</button></div><div id="modalbody"></div></div></div><script src="app.js" defer></script></body></html>
